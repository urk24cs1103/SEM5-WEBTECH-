<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestWise Growth Calculator</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f172a; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .calc-card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 10px; 
            width: 320px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border-top: 4px solid #10b981;
        }
        h2 { color: #ffffff; margin-bottom: 20px; font-size: 20px; text-align: center; }
        label { display: block; margin-top: 12px; font-size: 14px; color: #cbd5e1; }
        input { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border-radius: 5px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            box-sizing: border-box; 
            outline: none;
        }
        input:focus { border-color: #10b981; }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 20px; 
            background: #10b981; 
            border: none; 
            color: white; 
            font-weight: bold; 
            font-size: 15px;
            border-radius: 5px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: #059669; }
        .results { margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px; }
        .results p { margin: 8px 0; font-size: 14px; color: #94a3b8; }
        span { color: #10b981; font-weight: bold; float: right; }
    </style>
</head>
<body>

    <div class="calc-card">
        <h2>Growth Calculator</h2>

        <label>Starting Capital ($):</label>
        <input type="number" id="principal" placeholder="e.g. 5000">

        <label>Annual Return Rate (%):</label>
        <input type="number" id="rate" placeholder="e.g. 8">

        <label>Investment Duration (Years):</label>
        <input type="number" id="years" placeholder="e.g. 10">

        <button id="calcBtn">Calculate Growth</button>

        <div class="results">
            <p>Total Balance: <span id="totalBalance">$0.00</span></p>
            <p>Total Profit: <span id="totalProfit">$0.00</span></p>
        </div>
    </div>

<script src="5.js"></script>

</body>
</html>

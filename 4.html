<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestWise | Sign In & Sign Up</title>
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #0f172a;
    color: #333;
}

header {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
    border-bottom: 2px solid #10b981;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 45px;
    height: 45px;
}

.brand-name {
    color: #ffffff;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 1px;
}


nav {
    background: transparent;
}

nav ul {
    list-style: none;
    display: flex;
}

nav ul li {
    position: relative;
}

nav ul li a {
    color: #e2e8f0;
    text-decoration: none;
    display: block;
    padding: 12px 24px;
    font-weight: 600;
    transition: all 0.3s ease;
}

nav ul li:hover > a {
    background: #10b981;
    color: #ffffff;
    border-radius: 4px;
}


.dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #1e293b;
    width: 200px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    border-radius: 0 0 6px 6px;
    z-index: 100;
}

.dropdown li {
    width: 100%;
}

.dropdown li a {
    padding: 12px 18px;
    color: #cbd5e1;
    font-size: 14px;
}

nav ul li:hover .dropdown {
    display: block;
}

.dropdown li:hover a {
    background: #059669;
    color: #ffffff;
}


.container {
    background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                url("https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1500&q=80");
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    padding: 70px 20px;
    min-height: calc(100vh - 180px);
}

.box {
    background: #ffffff;
    width: 360px;
    padding: 35px 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    border-top: 4px solid #10b981;
}

.box h2 {
    text-align: center;
    margin-bottom: 24px;
    color: #0f172a;
    font-size: 22px;
}

label {
    display: block;
    font-weight: 600;
    font-size: 14px;
    color: #475569;
    margin-bottom: 6px;
}

input[type=text],
input[type=email],
input[type=password] {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
}
input[type=text]:focus,
input[type=email]:focus,
input[type=password]:focus {
    border-color: #10b981;
}
input[type=submit] {
    width: 100%;
    padding: 12px;
    border: none;
    background: #10b981;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.3s ease;
}
input[type=submit]:hover {
    background: #059669;
}
footer {
    background: #0f172a;
    color: #94a3b8;
    text-align: center;
    padding: 20px;
    font-size: 14px;
    line-height: 1.6;
    border-top: 1px solid #334155;
}
</style>
<body>
    <header>
        <div class="brand">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135706.png" class="logo" alt="InvestWise Logo">
            <span class="brand-name">Investment Blog</span>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="#">Market News</a>
                    <ul class="dropdown">
                        <li><a href="#">Stocks</a></li>
                        <li><a href="#">Crypto</a></li>
                        <li><a href="#">Real Estate</a></li>
                        <li><a href="#">Bonds & Mutual Funds</a></li>
                    </ul>
                </li>
                <li><a href="#">Strategies</a></li>
                <li><a href="#">Model Portfolios</a></li>
                <li><a href="#">Resources</a></li>
            </ul>
        </nav>
    </header>
    <section class="container">
        <div class="box">
            <h2>Sign In</h2>
            <form>
                <label>Username / Email</label>
                <input type="text" placeholder="Enter Username or Email" required>
                <label>Password</label>
                <input type="password" placeholder="Enter Password" required>
                <input type="submit" value="Access Portfolio">
            </form>
        </div>

        <div class="box">
            <h2>Sign Up</h2>
            <form>
                <label>Full Name</label>
                <input type="text" placeholder="Enter Full Name" required>
                <label>Email Address</label>
                <input type="email" placeholder="Enter Email" required>
                <label>Password</label>
                <input type="password" placeholder="Create Password" required>
                <input type="submit" value="Start Investing">
            </form>
        </div>
    </section>
    <footer>
        <p>© Investment Blog. URK24CS1103 - Web Technology. All Rights Reserved.</p>
    </footer>
</body>
</html>

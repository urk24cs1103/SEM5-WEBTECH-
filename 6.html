<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance & Investment Blog - JavaScript Styles & Animations</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin: 15px auto; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn { padding: 8px 15px; margin: 5px; background: #10b981; border: none; color: white; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #059669; }
        #animContainer { width: 100%; height: 40px; background: #334155; position: relative; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        #tickerBox { width: 80px; height: 30px; background: #10b981; position: absolute; top: 5px; left: 0; line-height: 30px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <h2>Finance & Investment Dashboard</h2>

    <div class="card">
        <h3 id="ticker">Stock Market Update</h3>
        <p id="clock">Loading Time...</p>
    </div>

    <div class="card">
        <p id="promoText">Exclusive Investment Tip Available!</p>
        <button class="btn" onclick="toggleStyle()">Toggle Theme</button>
        <button class="btn" onclick="hidePromo()">Hide Tip</button>
        <button class="btn" onclick="showPromo()">Show Tip</button>
    </div>

    <div class="card">
        <h4>Market Ticker Animation</h4>
        <div id="animContainer">
            <div id="tickerBox">NIFTY 50</div>
        </div>
        <br>
        <button class="btn" onclick="startTicker()">Move Ticker</button>
        <button class="btn" onclick="fadeOutCard()">Fade Box</button>
    </div>

    <script>
        class MarketAsset {
            constructor(name, price) {
                this.name = name;
                this.price = price;
            }
            getInfo() {
                return `${this.name}: $${this.price}`;
            }
        }
        const asset = new MarketAsset("Bitcoin", 65000);
        document.getElementById("ticker").innerText = asset.getInfo();

        setInterval(() => {
            const now = new Date();
            document.getElementById("clock").innerText = "Time: " + now.toTimeString().split(' ')[0];
        }, 1000);


        function toggleStyle() {
            let txt = document.getElementById("promoText");
            txt.style.color = txt.style.color === "yellow" ? "white" : "yellow";
            txt.style.backgroundColor = txt.style.backgroundColor === "rgb(30, 41, 59)" ? "#059669" : "#1e293b";
        }
        function hidePromo() { document.getElementById("promoText").style.display = "none"; }
        function showPromo() { document.getElementById("promoText").style.display = "block"; }

        function startTicker() {
            let box = document.getElementById("tickerBox");
            let pos = 0;
            let timer = setInterval(() => {
                if (pos >= 260) clearInterval(timer);
                else { pos++; box.style.left = pos + "px"; }
            }, 10);
        }

        function fadeOutCard() {
            let box = document.getElementById("tickerBox");
            let op = 1;
            let timer = setInterval(() => {
                if (op <= 0) clearInterval(timer);
                else { op -= 0.05; box.style.opacity = op; }
            }, 30);
        }
    </script>
</body>
</html>
